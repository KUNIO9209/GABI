<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GABI — YM2612 DAC Voice Degradation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #333;
    --surface: rgba(255,255,255,0.015);
    --border: rgba(255,255,255,0.06);
    --dim: rgba(255,255,255,0.2);
    --muted: rgba(255,255,255,0.4);
    --text: #d0d0dc;
    --white: #fff;
    --accent: #2832E8;
    --accent-glow: rgba(40,50,232,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 13px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 600px 400px at 50% 20%, rgba(40,50,232,0.04), transparent);
    pointer-events: none; z-index: 0;
  }
  .wrap {
    position: relative; z-index: 1; width: 100%; max-width: 500px; padding: 0 20px;
    min-height: 100vh; display: flex; flex-direction: column;
    justify-content: center; align-items: center;
  }

  /* Logo + Box group */
  .hero {
    display: flex; flex-direction: column; align-items: center;
    gap: 24px;
  }
  .logo { width: 456px; max-width: 100%; image-rendering: auto; display: block; }

  /* Drop zone */
  .dropzone {
    border: none; border-radius: 12px;
    padding: 20px; text-align: center; cursor: pointer;
    background: #000; transition: all 0.15s; width: 456px; max-width: 100%;
    box-shadow: inset 0 0 0 20px #9A2252;
  }
  .dropzone:hover, .dropzone.over {
    box-shadow: inset 0 0 0 20px #b82a63;
  }
  .drop-img { width: 374px; max-width: 100%; display: block; margin: 20px auto; }
  .drop-icon { font-size: 28px; opacity: 0.15; margin-bottom: 8px; }
  .drop-label { color: var(--dim); font-size: 12px; }
  .drop-sub { color: rgba(255,255,255,0.1); font-size: 10px; margin-top: 4px; }
  .file-name { color: var(--white); font-size: 14px; font-weight: 700; }
  .file-info { color: var(--dim); font-size: 10px; margin-top: 6px; }

  /* Loading */
  .loading {
    text-align: center; padding: 28px; color: var(--dim);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

  /* Buttons */
  .controls { margin-top: 16px; display: flex; flex-direction: column; gap: 6px; }
  .play-btn {
    width: 100%; padding: 16px 18px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--muted); font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer; transition: all 0.12s;
    text-align: left; display: flex; align-items: center; gap: 14;
  }
  .play-btn:hover { border-color: rgba(255,255,255,0.12); }
  .play-btn.active-orig { border-color: var(--white); background: rgba(255,255,255,0.05); color: var(--white); }
  .play-btn.active-proc { border-color: var(--accent); background: var(--accent-glow); color: var(--accent); }
  .play-icon { font-size: 20px; width: 32px; text-align: center; flex-shrink: 0; }
  .play-label { font-weight: 700; }
  .play-desc { font-size: 9px; opacity: 0.35; margin-top: 2px; }

  /* Download link */
  .dl-link {
    display: block; margin-top: 14px; padding: 14px 18px; border-radius: 8px;
    border: 1px solid var(--accent); background: var(--accent);
    color: var(--white); font-size: 12px; font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    text-align: center; text-decoration: none; letter-spacing: 1px;
    transition: all 0.12s;
  }
  .dl-link:hover { filter: brightness(1.15); }

  /* Footer */
  .footer {
    margin-top: 48px; padding-bottom: 40px; font-size: 9px;
    color: rgba(255,255,255,0.1); text-align: center; line-height: 2.2;
  }
  .footer span { color: rgba(255,255,255,0.06); }
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <img class="logo" id="logo" alt="GABI" src="">
    <div class="dropzone" id="dropzone">
      <img class="drop-img" id="drop-img" alt="Drop WAV HERE" src="">
    </div>
  <div style="margin-top:16px;font-size:10px;color:#fff;letter-spacing:2px">GABI Ver.1.0 by KUNIO</div>
  </div>
</div>

    for(let i=0;i<dsN;i++){

      crushed[i]=s;
    }

  }

    }

    let pi=out[0],po=out[0];
    for(let i=1;i<n;i++){const c=out[i];po=alpha*(po+c-pi);pi=c;out[i]=po;}
  }
  if(lpfHz>0){
    const a=(1/srIn)/(1/(2*Math.PI*lpfHz)+1/srIn);
    for(let i=1;i<n;i++)out[i]=out[i-1]+a*(out[i]-out[i-1]);
  }
  if(attackBoost>1||gapRatio>0){
    for(let i=0;i<n;i++){
      const pos=(i/samplesPerDac)-Math.floor(i/samplesPerDac);
      const soundEnd=1-gapRatio;
      if(pos>=soundEnd)out[i]=0;
      else if(attackBoost>1){const t=pos/soundEnd;out[i]*=1+(attackBoost-1)*Math.exp(-t*decaySpeed);}
    }
  }
  let pk=0;
  for(let i=0;i<n;i++){const v=Math.abs(out[i]);if(v>pk)pk=v;}
  if(pk>1){const g=0.98/pk;for(let i=0;i<n;i++)out[i]*=g;}
  return out;
}

// === WAV encoder ===
function encodeWav(samples, sr) {
  const n=samples.length,ds=n*2;
  const buf=new ArrayBuffer(44+ds);
  const v=new DataView(buf);
  function w(o,s){for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));}
  w(0,"RIFF");v.setUint32(4,36+ds,true);w(8,"WAVE");
  w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);
  v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);
  v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,"data");v.setUint32(40,ds,true);
  for(let i=0;i<n;i++){
    let s=Math.round(samples[i]*32767);
    if(s>32767)s=32767;if(s<-32768)s=-32768;
    v.setInt16(44+i*2,s,true);
  }
  return new Blob([buf],{type:"audio/wav"});
}

// === File loading ===
async function loadFile(file) {
  if(!file) return;
  playSE();
  try {
    const ab = await file.arrayBuffer();
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const dec = await ac.decodeAudioData(ab);
    const ch0 = dec.getChannelData(0);
    let mono;
    if (dec.numberOfChannels >= 2) {
      const ch1 = dec.getChannelData(1);
      mono = new Float32Array(ch0.length);
      for (let i=0;i<ch0.length;i++) mono[i]=(ch0[i]+ch1[i])*0.5;
    } else { mono = new Float32Array(ch0); }
    fileSr = dec.sampleRate;
    inputBuf = mono;
    ac.close();

    setTimeout(() => {
      outputBuf = process(mono, fileSr);
      // Auto download
      const blob = encodeWav(outputBuf, fileSr);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const base = file.name.replace(/\.[^.]+$/, '') || 'output';
      a.href = url; a.download = base + '_gabi.wav';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 60);
  } catch(e) {
    console.error(e);
  }
}

// === Playback ===
function stopCurrent() {
  if (currentSource) {
    try { currentSource.stop(); currentCtx.close(); } catch(e){}
    currentSource = null; currentCtx = null;
  }
  playing = null;
  updateButtons();
}

function doPlay(which) {
  if (playing === which) { stopCurrent(); return; }
  stopCurrent();
  const buf = which === 'orig' ? inputBuf : outputBuf;
  if (!buf) return;
  playing = which;
  updateButtons();
  const ac = new (window.AudioContext||window.webkitAudioContext)();
  const b = ac.createBuffer(1, buf.length, fileSr);
  b.getChannelData(0).set(buf);
  const s = ac.createBufferSource();
  s.buffer = b; s.connect(ac.destination);
  s.onended = () => { stopCurrent(); };
  s.start(0);
  currentSource = s; currentCtx = ac;
}

function updateButtons() {
  const bo = document.getElementById('btn-orig');
  const bp = document.getElementById('btn-proc');
  bo.className = 'play-btn' + (playing==='orig'?' active-orig':'');
  bp.className = 'play-btn' + (playing==='proc'?' active-proc':'');
  document.getElementById('icon-orig').textContent = playing==='orig'?'■':'▶';
  document.getElementById('icon-proc').textContent = playing==='proc'?'■':'▶';
}

// === Drag & drop ===
const dz = document.getElementById('dropzone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragenter', e => { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', e => { e.preventDefault(); dz.classList.remove('over'); });
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('over');
  const f = e.dataTransfer?.files?.[0]; if(f) loadFile(f);
});
dz.addEventListener('click', () => {
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='audio/*';
  inp.onchange = e => loadFile(e.target.files[0]);
  inp.click();
});
</script>
